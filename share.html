    <script>
        var ua = navigator.userAgent;
        var isAndroid = /android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        
        var deepLink = "todaktodot://share" + window.location.search;
        var playStoreURL = "https://play.google.com/store/apps/details?id=info.towdak.towdot";
        var appStoreURL = "https://apps.apple.com/kr/app/id6759151979";
        
        window.location.href = deepLink;
        
        setTimeout(function() {
            if (isAndroid) {
                window.location.href = playStoreURL;
            } else {
                window.location.href = appStoreURL;
            }
        }, 1500);
    </script>
